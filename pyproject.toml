[build-system]
requires = ["setuptools>=77"]  # 77: the license as an SPDX expression
build-backend = "setuptools.build_meta"

[project]
name = "cube-net"
dynamic = ["version"]  # from `cube_net.__version__`, which the release script sets
description = "Desktop application to explore unit cube nets by cutting and re-gluing them."
readme = "docs/idea.txt"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Viktor Podust" }]
dependencies = [
    "PyQt6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "packaging>=24",  # the release script checks versions with it
]

[project.scripts]
cube-net = "cube_net.app:main"

[tool.setuptools.dynamic]
version = { attr = "cube_net.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cube_net.ui.icons" = ["*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # so that the tests can import `scripts.release`
addopts = "-ra"
qt_api = "pyqt6"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Russian texts: their Cyrillic letters look like Latin ones, and that's fine.
"src/cube_net/ui/i18n/*.py" = ["RUF001"]
"tests/**/*.py" = ["RUF001"]

[tool.mypy]
python_version = "3.14"
files = ["src/cube_net/core"]
warn_unused_ignores = true

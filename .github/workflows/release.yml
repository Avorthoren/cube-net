# The release of a version: a pushed tag "v1.2.0" (`./release.sh 1.2.0` makes one) is checked, built for Windows,
# Linux and macOS, and becomes a draft release with the builds, their checksums and the changelog's notes: publish it
# on the Releases page after a look.
#
# Started by hand (Actions -> Release -> Run workflow, from any branch), it's a test build: the checks (unless skipped)
# and the builds of the chosen systems, kept for a week under the run (Artifacts, at the bottom of its page), named
# by their commit (CubeNet-abc1234-linux-x86_64.AppImage; after the version once one is released). It releases
# nothing, unless it's started from a tag for all the systems: that's the same as pushing the tag.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      system:
        description: Build for
        type: choice
        options: [all, Linux, Windows, macOS]
        default: all
      skip_checks:
        description: Skip ruff and the tests (a quicker test build)
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  PYINSTALLER: "pyinstaller==6.22.3"
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage

  # The builds: which system, on which machine.
  BUILDS: >-
    [{"system": "Linux", "runner": "ubuntu-22.04"},
     {"system": "Windows", "runner": "windows-2025"},
     {"system": "macOS", "runner": "macos-15"}]

  # Qt's system libraries on Linux: what it needs to run (the tests, the launch test), and what PyInstaller puts into
  # the AppImage so that it runs where they're missing.
  QT_LIBRARIES: >-
    libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
    libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
    libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-xfixes0

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.builds.outputs.builds }}
    steps:
      - name: The builds to make
        id: builds
        env:
          CHOSEN: ${{ inputs.system || 'all' }}  # a pushed tag builds them all
        run: echo "builds=$(echo "$BUILDS" | jq -c --arg s "$CHOSEN" 'map(select($s == "all" or .system == $s))')" >> "$GITHUB_OUTPUT"

  check:
    name: Check
    if: ${{ !inputs.skip_checks }}
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the whole history and every tag: is the tag on master, is it higher than the others
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y $QT_LIBRARIES
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check the tag
        id: tag
        if: github.ref_type == 'tag'
        run: python -m scripts.check_release "$GITHUB_REF_NAME" release-notes.md
      - name: Ruff
        run: python -m ruff check . && python -m ruff format --check .
      - name: Tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  build:
    name: Build (${{ matrix.system }})
    needs: [plan, check]
    # After the checks, or without them if they were skipped (a test build).
    if: ${{ !cancelled() && needs.plan.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.check.result) }}
    strategy:
      fail-fast: false  # a failed build doesn't cancel the others: each system's result is seen
      # Ubuntu 22.04: an old one, what's built on it runs on newer systems too, not the other way round. Windows Server
      # 2025: it has Inno Setup. macOS 15: Apple silicon.
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the tags: a test build is named after the latest version only once one is released
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Qt's system libraries and appimagetool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y $QT_LIBRARIES
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" "$APPIMAGETOOL_URL"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - name: Install
        run: pip install . "${{ env.PYINSTALLER }}"
      - name: Build and launch-test
        run: python -m scripts.build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: build-${{ matrix.system }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: Draft release
    needs: [check, build]
    # A tag's, with every system built (a test build of one system from a tag releases nothing).
    if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.system == 'all')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: build-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "Cube Net $VERSION" \
            --notes-file release-notes.md "${flags[@]}"
